<style>
/* One-screen photo tool: preview on top, tabbed controls below, one primary action pinned to the bottom. */
:root {
  --bg: #f3efe8; --surface: #fbf9f5; --well: #e9e2d6; --line: #ddd5c8;
  --fg: #1d1b18; --muted: #5f5a52; --accent: #1f5f5b; --accent-soft: #e2eeec; --on-accent: #ffffff;
  --danger: #9a3412; --scrim: #141413; --on-scrim: #f4f1ec; --on-scrim-muted: #cfc8bc;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171816; --surface: #1f211e; --well: #2a2c28; --line: #3a3d37;
    --fg: #ece8e0; --muted: #a8a399; --accent: #6fb5ae; --accent-soft: #1f3432; --on-accent: #0f1a19;
    --danger: #f0a07a; --scrim: #0b0b0a; --on-scrim: #f4f1ec; --on-scrim-muted: #bdb6aa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171816; --surface: #1f211e; --well: #2a2c28; --line: #3a3d37;
  --fg: #ece8e0; --muted: #a8a399; --accent: #6fb5ae; --accent-soft: #1f3432; --on-accent: #0f1a19;
  --danger: #f0a07a; --scrim: #0b0b0a; --on-scrim: #f4f1ec; --on-scrim-muted: #bdb6aa;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, label { touch-action: manipulation; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tile .empty { width: 100%; height: 100%; box-sizing: border-box; border: 2px dashed color-mix(in srgb, var(--muted) 55%, transparent); background: color-mix(in srgb, var(--surface) 55%, transparent); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }

.result .save { width: 100%; min-height: 52px; border: none; border-radius: 14px; background: var(--on-scrim); color: var(--scrim); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }

<body>
<div class="app" id="app">
  <div class="top">
    <h1>Collage</h1>
    <button type="button" class="link-btn" id="btn-new" hidden>Neu</button>
  </div>

  <div class="stage" id="stage"><div id="frame"></div></div>
  <p class="hint" id="hint" aria-live="polite"></p>

  <div class="tabs" role="tablist" aria-label="Werkzeuge">
    <button type="button" role="tab" id="tab-photos" aria-controls="p-photos" aria-selected="true">Fotos</button>
    <button type="button" role="tab" id="tab-layout" aria-controls="p-layout" aria-selected="false">Layout</button>
    <button type="button" role="tab" id="tab-style" aria-controls="p-style" aria-selected="false">Stil</button>
  </div>

  <div class="panel">
    <section id="p-photos" role="tabpanel" aria-labelledby="tab-photos">
      <label class="pick">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
        <span>Fotos aus Galerie wählen</span>
        <input type="file" id="file-input" accept="image/*" multiple>
      </label>
      <div class="strip" id="thumbs" hidden></div>
      <div class="row">
        <span>Anzahl Felder</span>
        <div class="stepper">
          <button type="button" id="slot-minus" aria-label="Ein Feld weniger">−</button>
          <output id="slot-count">4</output>
          <button type="button" id="slot-plus" aria-label="Ein Feld mehr">+</button>
        </div>
      </div>
    </section>

    <section id="p-layout" role="tabpanel" aria-labelledby="tab-layout" hidden>
      <div class="layouts" id="layouts"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="label-cap">Seitenverhältnis</span>
        <div class="pills" id="ratios"></div>
      </div>
      <button type="button" class="link-btn" id="reset-sizes" style="align-self:flex-start;text-decoration:underline;padding:0" hidden>Feldgrößen zurücksetzen</button>
    </section>

    <section id="p-style" role="tabpanel" aria-labelledby="tab-style" hidden>
      <div class="slider"><div class="row"><label for="s-gap">Abstand</label><output id="o-gap"></output></div><input type="range" id="s-gap" min="0" max="160" step="2"></div>
      <div class="slider"><div class="row"><label for="s-margin">Außenrand</label><output id="o-margin"></output></div><input type="range" id="s-margin" min="0" max="240" step="2"></div>
      <div class="slider"><div class="row"><label for="s-radius">Eckenrundung</label><output id="o-radius"></output></div><input type="range" id="s-radius" min="0" max="160" step="2"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span>Hintergrund</span>
        <div class="swatches" id="swatches"></div>
      </div>
    </section>
  </div>

  <div class="bottom">
    <button type="button" class="primary" id="btn-make" disabled>Collage fertigstellen</button>
  </div>

  <div class="result" id="result" role="dialog" aria-modal="true" aria-label="Fertige Collage" hidden>
    <header><span>Fertig!</span><button type="button" id="btn-edit">Bearbeiten</button></header>
    <div class="shot"><img id="result-img" alt="Fertige Collage"></div>
    <footer>
      <button type="button" class="save" id="btn-save">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
        <span id="btn-save-label">In Fotos sichern</span>
      </button>
      <p id="save-hint"></p>
    </footer>
  </div>
</div>

<script>
(function () {
  var RATIOS = [
    { id: '4:5', label: '4 : 5', w: 1920, h: 2400 },
    { id: '9:16', label: '9 : 16', w: 1350, h: 2400 },
    { id: '1:1', label: '1 : 1', w: 2400, h: 2400 },
    { id: '3:2', label: '3 : 2', w: 2400, h: 1600 },
    { id: '16:9', label: '16 : 9', w: 2400, h: 1350 }
  ];
  var LAYOUTS = [
    { id: 'grid', label: 'Raster' }, { id: 'mosaic', label: 'Mosaik' }, { id: 'hero', label: 'Hauptbild' },
    { id: 'stack', label: 'Untereinander' }, { id: 'strip', label: 'Nebeneinander' }
  ];
  var SWATCHES = [
    { c: '#ffffff', label: 'Weiß' }, { c: '#f3efe8', label: 'Creme' }, { c: '#e8d9c5', label: 'Sand' },
    { c: '#141413', label: 'Schwarz' }, { c: '#1f5f5b', label: 'Petrol' }, { c: '#d97757', label: 'Terrakotta' }
  ];
  var PREFS_KEY = 'collage-prefs-v1';

  var state = { photos: [], slots: 4, layout: 'grid', ratio: '4:5', gap: 24, margin: 24, radius: 0, bg: '#ffffff', weights: {}, tab: 'photos', msg: '', warn: false, busy: false };
  try {
    var saved = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null');
    if (saved) ['layout', 'ratio', 'gap', 'margin', 'radius', 'bg', 'slots'].forEach(function (k) { if (saved[k] !== undefined) state[k] = saved[k]; });
  } catch (e) {}
  function savePrefs() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify({ layout: state.layout, ratio: state.ratio, gap: state.gap, margin: state.margin, radius: state.radius, bg: state.bg, slots: state.slots })); } catch (e) {}
  }

  /* ---------- layout geometry: a split tree per layout ---------- */
  function buildTree(kind, n, W, H, m) {
    var idx = 0;
    function leaf() { return { leaf: idx++ }; }
    function group(dir, count, weights) {
      var kids = []; for (var i = 0; i < count; i++) kids.push(leaf());
      return count === 1 ? kids[0] : { dir: dir, kids: kids, w: weights || null };
    }
    function rowsOf(counts, wf) {
      return { dir: 'col', w: null, kids: counts.map(function (c, ri) { return group('row', c, wf ? wf(c, ri) : null); }) };
    }
    if (n <= 1) return leaf();
    if (kind === 'strip') return group('row', n);
    if (kind === 'stack') return group('col', n);
    if (kind === 'hero') {
      var w = Math.max(1, W - 2 * m), h = Math.max(1, H - 2 * m), land = w >= h * 0.9, rest = n - 1, main = leaf(), side, counts = [];
      if (rest <= 3) side = group(land ? 'col' : 'row', rest);
      else {
        for (var k = 0; k < Math.ceil(rest / 2); k++) counts.push(Math.min(2, rest - k * 2));
        side = { dir: land ? 'col' : 'row', w: null, kids: counts.map(function (c) { return group(land ? 'row' : 'col', c); }) };
      }
      return { dir: land ? 'row' : 'col', w: [0.62, 0.38], kids: [main, side] };
    }
    if (kind === 'mosaic') {
      var cs = [], rem = n, i = 0;
      while (rem > 0) {
        if (rem <= 3) { cs.push(rem); break; }
        var c = i % 2 === 0 ? 2 : 3;
        if (rem - c === 1) c = 2;
        cs.push(c); rem -= c; i++;
      }
      return rowsOf(cs, function (cnt, ri) {
        return cnt === 2 ? (ri % 2 === 0 ? [3, 2] : [2, 3]) : cnt === 3 ? (ri % 2 === 0 ? [4, 3, 3] : [3, 3, 4]) : null;
      });
    }
    var cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols), gc = [];
    for (var r = 0; r < rows; r++) gc.push(Math.min(cols, n - r * cols));
    return rowsOf(gc);
  }
  function layoutTree(node, x, y, w, h, g, path, prefix, wmap, out, handles) {
    if (node.leaf !== undefined) { out[node.leaf] = { x: x, y: y, w: w, h: h }; return; }
    var k = node.kids.length, horiz = node.dir === 'row', key = prefix + path;
    var ov = wmap && wmap[key], weights = (ov && ov.length === k) ? ov : (node.w || node.kids.map(function () { return 1; }));
    var S = weights.reduce(function (a, b) { return a + b; }, 0) || 1;
    var avail = Math.max(1, (horiz ? w : h) - g * (k - 1)), pos = horiz ? x : y;
    var sizes = weights.map(function (wt) { return avail * wt / S; });
    for (var i = 0; i < k; i++) {
      var sz = sizes[i], kp = path + '.' + i + (node.kids[i].dir || '');
      if (horiz) layoutTree(node.kids[i], pos, y, sz, h, g, kp, prefix, wmap, out, handles);
      else layoutTree(node.kids[i], x, pos, w, sz, g, kp, prefix, wmap, out, handles);
      if (i < k - 1) handles.push({ key: key, i: i, horiz: horiz, at: pos + sz + g / 2, x: x, y: y, w: w, h: h, sizes: sizes.slice(), avail: avail });
      pos += sz + g;
    }
  }
  function computeLayout(kind, n, W, H, m, g, wmap) {
    var tree = buildTree(kind, n, W, H, m), out = [], handles = [];
    layoutTree(tree, m, m, Math.max(1, W - 2 * m), Math.max(1, H - 2 * m), g, tree.dir || 'leaf', kind + '|' + n + '|', wmap, out, handles);
    return { cells: out, handles: handles };
  }

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), frame = $('frame');
  function ratio() { return RATIOS.find(function (r) { return r.id === state.ratio; }) || RATIOS[0]; }
  function slotArr() {
    var n = Math.max(state.slots, state.photos.length, 1), a = [];
    for (var i = 0; i < n; i++) a.push(state.photos[i] || null);
    return a;
  }
  function geom() {
    var R = ratio(), arr = slotArr();
    var bw = Math.max(50, stage.clientWidth - 24), bh = Math.max(50, stage.clientHeight - 24);
    var scale = Math.min(bw / R.w, bh / R.h);
    var lay = computeLayout(state.layout, arr.length, R.w, R.h, state.margin, state.gap, state.weights);
    return { R: R, arr: arr, scale: scale, cells: lay.cells, handles: lay.handles };
  }
  function px(v) { return (Math.round(v * 100) / 100) + 'px'; }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function setMsg(text, warn) { state.msg = text || ''; state.warn = !!warn; renderHint(); }
  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* ---------- stage rendering ---------- */
  var drag = null, rz = null;
  function renderStage() {
    var g = geom(), s = g.scale;
    frame.style.width = px(g.R.w * s); frame.style.height = px(g.R.h * s); frame.style.background = state.bg;
    var tiles = frame.querySelectorAll('.tile');
    for (var t = g.cells.length; t < tiles.length; t++) tiles[t].remove();
    g.cells.forEach(function (c, i) {
      var el = frame.querySelectorAll('.tile')[i];
      if (!el) {
        el = document.createElement('div');
        el.className = 'tile';
        el.innerHTML = '<img alt="" draggable="false" hidden><div class="empty"></div><div class="ring"></div>';
        el.addEventListener('pointerdown', function (e) { startDrag(Number(el.dataset.i), e); });
        el.addEventListener('dblclick', function () { var p = state.photos[Number(el.dataset.i)]; if (p) { p.ox = 0.5; p.oy = 0.5; renderStage(); } });
        var hs = frame.querySelector('.rz');
        frame.insertBefore(el, hs);
      }
      el.dataset.i = i;
      var ph = g.arr[i], img = el.querySelector('img'), empty = el.querySelector('.empty');
      el.style.left = px(c.x * s); el.style.top = px(c.y * s); el.style.width = px(c.w * s); el.style.height = px(c.h * s);
      el.style.borderRadius = px(state.radius * s);
      el.classList.toggle('is-empty', !ph);
      el.classList.toggle('source', !!(drag && drag.target !== drag.i && drag.i === i));
      el.classList.toggle('target', !!(drag && drag.target !== drag.i && drag.target === i));
      if (ph) {
        if (img.getAttribute('src') !== ph.url) img.src = ph.url;
        img.hidden = false; empty.hidden = true;
        img.style.objectPosition = (ph.ox * 100).toFixed(2) + '% ' + (ph.oy * 100).toFixed(2) + '%';
      } else {
        img.hidden = true; img.removeAttribute('src'); empty.hidden = false; empty.textContent = 'Foto ' + (i + 1);
      }
    });
    frame.querySelectorAll('.rz').forEach(function (h) { if (!rz || h !== rz.el) h.remove(); });
    if (!drag) {
      g.handles.forEach(function (h) {
        if (rz && rz.h.key === h.key && rz.h.i === h.i) { placeHandle(rz.el, h, s); return; }
        var el = document.createElement('div');
        el.className = 'rz ' + (h.horiz ? 'h' : 'v');
        el.setAttribute('aria-hidden', 'true');
        el.innerHTML = '<i></i>';
        placeHandle(el, h, s);
        el.addEventListener('pointerdown', function (e) { startResize(h, el, e); });
        frame.appendChild(el);
      });
    }
    $('reset-sizes').hidden = !Object.keys(state.weights).some(function (k) { return k.indexOf(state.layout + '|' + g.arr.length + '|') === 0; });
  }
  function placeHandle(el, h, s) {
    var thick = Math.max(state.gap * s, 28), grip = el.firstChild;
    if (h.horiz) {
      el.style.left = px(h.at * s - thick / 2); el.style.top = px(h.y * s); el.style.width = px(thick); el.style.height = px(h.h * s);
      grip.style.width = '6px'; grip.style.height = px(Math.min(40, h.h * s * 0.6));
    } else {
      el.style.left = px(h.x * s); el.style.top = px(h.at * s - thick / 2); el.style.width = px(h.w * s); el.style.height = px(thick);
      grip.style.height = '6px'; grip.style.width = px(Math.min(40, h.w * s * 0.6));
    }
  }

  /* ---------- drag: pan inside a field, or drop on another field to swap ---------- */
  function startDrag(i, e) {
    var arr = slotArr(), ph = arr[i];
    if (!ph || (e.button !== undefined && e.button !== 0)) return;
    e.preventDefault();
    var g = geom();
    drag = { i: i, x0: e.clientX, y0: e.clientY, ox0: ph.ox, oy0: ph.oy, frame: frame.getBoundingClientRect(), scale: g.scale, cells: g.cells, iw: ph.img.naturalWidth, ih: ph.img.naturalHeight, target: i };
    frame.querySelectorAll('.rz').forEach(function (h) { h.remove(); });
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
  }
  function onDragMove(e) {
    var d = drag; if (!d) return;
    var ph = state.photos[d.i];
    var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    var fx = (e.clientX - d.frame.left) / d.scale, fy = (e.clientY - d.frame.top) / d.scale;
    var hit = d.cells.findIndex(function (c) { return fx >= c.x && fx <= c.x + c.w && fy >= c.y && fy <= c.y + c.h; });
    if (hit !== -1 && hit !== d.i) { d.target = hit; ph.ox = d.ox0; ph.oy = d.oy0; renderStage(); return; }
    d.target = d.i;
    var c = d.cells[d.i], sc = Math.max(c.w / d.iw, c.h / d.ih);
    var exX = (d.iw * sc - c.w) * d.scale, exY = (d.ih * sc - c.h) * d.scale;
    ph.ox = exX > 0.5 ? clamp01(d.ox0 - dx / exX) : 0.5;
    ph.oy = exY > 0.5 ? clamp01(d.oy0 - dy / exY) : 0.5;
    renderStage();
  }
  function onDragEnd() {
    var d = drag; drag = null;
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragEnd);
    if (d && d.target !== d.i) swap(d.i, d.target); else renderStage();
  }
  function swap(i, j) {
    var arr = slotArr();
    if (i === j || j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    state.photos = arr;
    renderAll();
  }

  /* ---------- resize handles ---------- */
  function startResize(h, el, e) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    rz = { h: h, el: el, c0: h.horiz ? e.clientX : e.clientY, scale: geom().scale };
    el.classList.add('active');
    window.addEventListener('pointermove', onRzMove);
    window.addEventListener('pointerup', onRzEnd);
    window.addEventListener('pointercancel', onRzEnd);
  }
  function onRzMove(e) {
    var r = rz; if (!r) return;
    var h = r.h, delta = ((h.horiz ? e.clientX : e.clientY) - r.c0) / r.scale;
    var pair = h.sizes[h.i] + h.sizes[h.i + 1], minS = Math.min(pair / 2, Math.max(40, h.avail * 0.06));
    var a = Math.max(minS, Math.min(pair - minS, h.sizes[h.i] + delta));
    var sizes = h.sizes.slice(); sizes[h.i] = a; sizes[h.i + 1] = pair - a;
    state.weights[h.key] = sizes;
    renderStage();
  }
  function onRzEnd() {
    var r = rz; rz = null;
    window.removeEventListener('pointermove', onRzMove);
    window.removeEventListener('pointerup', onRzEnd);
    window.removeEventListener('pointercancel', onRzEnd);
    if (r) r.el.remove();
    renderStage();
  }

  /* ---------- controls ---------- */
  function renderHint() {
    var n = state.photos.filter(Boolean).length, hint = $('hint');
    hint.textContent = state.msg || (n ? 'Foto ziehen: Ausschnitt · auf anderes Feld: tauschen · Griffe: Größe' : 'Wähle Fotos aus deiner Galerie, um zu starten.');
    hint.classList.toggle('warn', !!(state.msg && state.warn));
  }
  function renderControls() {
    var arr = slotArr(), n = arr.filter(Boolean).length;
    $('btn-new').hidden = !n;
    $('btn-make').disabled = !n || state.busy;
    $('btn-make').textContent = state.busy ? 'Wird erstellt …' : 'Collage fertigstellen';
    $('slot-count').textContent = arr.length;

    var thumbs = $('thumbs');
    thumbs.hidden = !n;
    thumbs.innerHTML = '';
    arr.forEach(function (p, i) {
      if (!p) return;
      var d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML = '<img alt=""><span class="badge"></span><button type="button" aria-label="Foto ' + (i + 1) + ' entfernen"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></span></button>';
      d.querySelector('img').src = p.url;
      d.querySelector('.badge').textContent = i + 1;
      d.querySelector('button').addEventListener('click', function () { removePhoto(i); });
      thumbs.appendChild(d);
    });

    var lw = $('layouts'); lw.innerHTML = '';
    var miniN = Math.min(Math.max(arr.length, 2), 7);
    LAYOUTS.forEach(function (L) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', state.layout === L.id);
      var mini = '<div class="mini">' + computeLayout(L.id, miniN, 76, 56, 0, 3).cells.map(function (c) {
        return '<i style="left:' + px(c.x) + ';top:' + px(c.y) + ';width:' + px(c.w) + ';height:' + px(c.h) + '"></i>';
      }).join('') + '</div>';
      b.innerHTML = mini + '<span></span>';
      b.querySelector('span').textContent = L.label;
      b.addEventListener('click', function () { state.layout = L.id; savePrefs(); renderAll(); });
      lw.appendChild(b);
    });

    var rw = $('ratios'); rw.innerHTML = '';
    RATIOS.forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = r.label;
      b.setAttribute('aria-pressed', state.ratio === r.id);
      b.addEventListener('click', function () { state.ratio = r.id; savePrefs(); renderAll(); });
      rw.appendChild(b);
    });

    ['gap', 'margin', 'radius'].forEach(function (k) { $('s-' + k).value = state[k]; $('o-' + k).textContent = state[k] + ' px'; });

    var sw = $('swatches'); sw.innerHTML = '';
    SWATCHES.forEach(function (w) {
      var b = document.createElement('button');
      b.type = 'button'; b.style.background = w.c;
      b.setAttribute('aria-label', 'Hintergrund ' + w.label);
      b.setAttribute('aria-pressed', state.bg.toLowerCase() === w.c);
      b.addEventListener('click', function () { state.bg = w.c; savePrefs(); renderAll(); });
      sw.appendChild(b);
    });
    var lab = document.createElement('label');
    lab.innerHTML = '<input type="color" id="bg-custom" aria-label="Eigene Hintergrundfarbe">';
    var ci = lab.querySelector('input'); ci.value = state.bg;
    ci.addEventListener('input', function () { state.bg = ci.value; savePrefs(); renderStage(); });
    ci.addEventListener('change', function () { renderControls(); });
    sw.appendChild(lab);

    ['photos', 'layout', 'style'].forEach(function (t) {
      $('tab-' + t).setAttribute('aria-selected', state.tab === t);
      $('p-' + t).hidden = state.tab !== t;
    });
  }
  function renderAll() { renderControls(); renderStage(); renderHint(); }

  /* ---------- photos ---------- */
  var nextId = 1;
  function addFiles(list) {
    var files = Array.prototype.slice.call(list || []).filter(function (f) { return !f.type || f.type.indexOf('image/') === 0; });
    if (!files.length) return;
    setMsg('Fotos werden geladen …');
    Promise.all(files.map(function (f) {
      return new Promise(function (res) {
        var url = URL.createObjectURL(f), img = new Image();
        img.onload = function () { res({ id: nextId++, url: url, img: img, ox: 0.5, oy: 0.5 }); };
        img.onerror = function () { URL.revokeObjectURL(url); res(null); };
        img.src = url;
      });
    })).then(function (loaded) {
      var ok = loaded.filter(Boolean), arr = slotArr();
      ok.forEach(function (p) { var idx = arr.findIndex(function (x) { return !x; }); if (idx === -1) arr.push(p); else arr[idx] = p; });
      state.photos = arr;
      state.slots = Math.max(state.slots, arr.length);
      savePrefs();
      setMsg(ok.length < files.length ? (files.length - ok.length) + ' Datei(en) konnten nicht gelesen werden. Bitte JPG oder PNG verwenden.' : '', ok.length < files.length);
      renderAll();
    });
  }
  function removePhoto(i) {
    var arr = slotArr();
    if (arr[i]) URL.revokeObjectURL(arr[i].url);
    arr[i] = null; state.photos = arr; renderAll();
  }

  $('file-input').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  $('btn-new').addEventListener('click', function () {
    state.photos.forEach(function (p) { if (p) URL.revokeObjectURL(p.url); });
    state.photos = []; setMsg(''); renderAll();
  });
  $('slot-minus').addEventListener('click', function () {
    var a = slotArr();
    if (a.length <= 1) return;
    var idx = -1; for (var k = a.length - 1; k >= 0; k--) { if (!a[k]) { idx = k; break; } }
    if (idx === -1) { setMsg('Entferne zuerst ein Foto, um ein Feld zu löschen.', true); return; }
    a.splice(idx, 1); state.photos = a; state.slots = a.length; savePrefs(); setMsg(''); renderAll();
  });
  $('slot-plus').addEventListener('click', function () {
    var a = slotArr(); if (a.length >= 16) return;
    state.photos = a; state.slots = a.length + 1; savePrefs(); setMsg(''); renderAll();
  });
  ['photos', 'layout', 'style'].forEach(function (t) {
    $('tab-' + t).addEventListener('click', function () { state.tab = t; renderControls(); });
  });
  ['gap', 'margin', 'radius'].forEach(function (k) {
    $('s-' + k).addEventListener('input', function (e) { state[k] = +e.target.value; $('o-' + k).textContent = state[k] + ' px'; savePrefs(); renderStage(); });
  });
  $('reset-sizes').addEventListener('click', function () {
    var pre = state.layout + '|' + slotArr().length + '|';
    Object.keys(state.weights).forEach(function (k) { if (k.indexOf(pre) === 0) delete state.weights[k]; });
    renderStage();
  });

  stage.addEventListener('dragover', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') === -1) return;
    e.preventDefault(); stage.classList.add('dropping');
  });
  stage.addEventListener('dragleave', function (e) { if (!stage.contains(e.relatedTarget)) stage.classList.remove('dropping'); });
  stage.addEventListener('drop', function (e) { e.preventDefault(); stage.classList.remove('dropping'); addFiles(e.dataTransfer && e.dataTransfer.files); });

  /* ---------- export + save ---------- */
  var result = null;
  function canShareFile(file) {
    try { return !!(file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })); } catch (e) { return false; }
  }
  var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  $('btn-make').addEventListener('click', function () {
    var g = geom(), R = g.R;
    if (!g.arr.some(Boolean) || state.busy) return;
    state.busy = true; renderControls();
    setTimeout(function () {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = R.w; canvas.height = R.h;
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = state.bg; ctx.fillRect(0, 0, R.w, R.h);
        g.cells.forEach(function (c, i) {
          var ph = g.arr[i]; if (!ph) return;
          var img = ph.img, iw = img.naturalWidth, ih = img.naturalHeight;
          var sc = Math.max(c.w / iw, c.h / ih), sw = c.w / sc, sh = c.h / sc;
          ctx.save(); roundRectPath(ctx, c.x, c.y, c.w, c.h, state.radius); ctx.clip();
          ctx.drawImage(img, (iw - sw) * ph.ox, (ih - sh) * ph.oy, sw, sh, c.x, c.y, c.w, c.h);
          ctx.restore();
        });
        canvas.toBlob(function (blob) {
          canvas.width = canvas.height = 1;
          state.busy = false; renderControls();
          if (!blob) { setMsg('Das Bild konnte nicht erstellt werden. Versuche es mit weniger Fotos.', true); return; }
          var d = new Date(), p2 = function (v) { return (v < 10 ? '0' : '') + v; };
          if (result) URL.revokeObjectURL(result.url);
          result = { blob: blob, url: URL.createObjectURL(blob), name: 'collage-' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.jpg' };
          try { result.file = new File([blob], result.name, { type: 'image/jpeg' }); } catch (e) { result.file = null; }
          $('result-img').src = result.url;
          var share = canShareFile(result.file);
          $('btn-save-label').textContent = share || IS_IOS ? 'In Fotos sichern' : 'Bild herunterladen';
          $('save-hint').textContent = share
            ? 'Tippe auf „In Fotos sichern“ und wähle „Bild sichern“. Oder: Bild gedrückt halten → „Zu Fotos hinzufügen“.'
            : IS_IOS ? 'Halte das Bild gedrückt und wähle „Zu Fotos hinzufügen“.' : 'Das Bild wird als JPG gespeichert.';
          $('result').hidden = false;
          $('btn-edit').focus();
        }, 'image/jpeg', 0.92);
      } catch (e) {
        state.busy = false; renderControls();
        setMsg('Das Bild konnte nicht erstellt werden. Versuche es mit weniger Fotos.', true);
      }
    }, 30);
  });
  $('btn-edit').addEventListener('click', function () { $('result').hidden = true; });
  $('btn-save').addEventListener('click', function () {
    if (!result) return;
    var hint = $('save-hint');
    if (canShareFile(result.file)) {
      navigator.share({ files: [result.file] }).then(function () {
        hint.textContent = 'Erledigt. Wenn du „Bild sichern“ gewählt hast, ist die Collage jetzt in Fotos.';
      }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        downloadFallback(hint);
      });
      return;
    }
    downloadFallback(hint);
  });
  function downloadFallback(hint) {
    var a = document.createElement('a');
    a.href = result.url; a.download = result.name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    hint.textContent = IS_IOS
      ? 'Falls nichts passiert: Bild gedrückt halten → „Zu Fotos hinzufügen“.'
      : 'Download gestartet: ' + result.name;
  }

  window.addEventListener('resize', function () { renderStage(); });
  renderAll();
})();
</script>
</body>
</html>
